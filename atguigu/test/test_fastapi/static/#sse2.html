<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <button id="btn">点击发送请求</button>
    <div id="content"></div>




    <script>
        btn =document.getElementById("btn")
        btn.onclick = async function(){
            res = await fetch("http://localhost:8000/sse02",{
                method:"POST",
                body:JSON.stringify({
                    query:"who r u",
                    session_id:"abc"
                })
            })

            data=await  res.json()
            console.log(data)
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>掌柜智库 · 智能听书</title>
    <style>
        :root {
            --bg: #17110d;
            --panel: rgba(40, 31, 24, 0.72);
            --paper: #241b14;
            --text: #f0e6d6;
            --muted: #a99783;
            --brand: #e3b04b;
            --brand2: #c98a3a;
            --accent: #d46a4a;
            --bubble-user: linear-gradient(135deg, #f0c46a, #d99a3f);
            --bubble-bot: rgba(34, 26, 20, 0.74);
            --border: rgba(240, 230, 214, 0.10);
            --border-strong: rgba(240, 230, 214, 0.16);
            --shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 18% 18%, rgba(227, 176, 75, 0.12), transparent 42%),
                radial-gradient(circle at 82% 12%, rgba(201, 138, 58, 0.10), transparent 40%),
                radial-gradient(circle at 50% 108%, rgba(212, 106, 74, 0.08), transparent 52%),
                linear-gradient(to right, rgba(240, 230, 214, 0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(240, 230, 214, 0.022) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
        }

        .app {
            width: 100%;
            max-width: 980px;
            height: min(840px, 94vh);
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶栏 ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(23, 17, 13, 0.55);
            position: relative;
        }

        .topbar::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(227, 176, 75, 0.55), transparent);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 250px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(135deg, rgba(227, 176, 75, 0.22), rgba(201, 138, 58, 0.14));
            border: 1px solid rgba(227, 176, 75, 0.35);
            box-shadow: 0 0 22px rgba(227, 176, 75, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .title strong {
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #f5ecdb;
        }

        .title span {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: 0.3px;
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 11px;
            border-radius: 999px;
            background: rgba(23, 17, 13, 0.55);
        }

        .btn {
            border: 1px solid var(--border-strong);
            background: rgba(227, 176, 75, 0.10);
            color: var(--brand);
            padding: 7px 13px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .btn:hover {
            background: rgba(227, 176, 75, 0.18);
            border-color: rgba(227, 176, 75, 0.4);
        }

        /* ===== 聊天区 ===== */
        .chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18px 16px 12px;
            background: rgba(23, 17, 13, 0.25);
        }

        .chat::-webkit-scrollbar {
            width: 8px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background: rgba(169, 151, 131, 0.25);
            border-radius: 8px;
        }

        .chat::-webkit-scrollbar-thumb:hover {
            background: rgba(227, 176, 75, 0.4);
        }

        .dayline {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 6px 0 16px;
            letter-spacing: 1px;
        }

        .msg {
            display: flex;
            gap: 11px;
            margin: 12px 0;
            align-items: flex-end;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg > div:not(.avatar) {
            flex: 1;
            min-width: 0;
        }

        .msg.user > div:not(.avatar) {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: rgba(227, 176, 75, 0.12);
            border: 1px solid rgba(227, 176, 75, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #d9b06a;
            flex: 0 0 auto;
            user-select: none;
        }

        .avatar.bot {
            background: linear-gradient(135deg, rgba(227, 176, 75, 0.20), rgba(201, 138, 58, 0.12));
            box-shadow: 0 0 14px rgba(227, 176, 75, 0.16);
        }

        .bubble {
            max-width: min(720px, 78%);
            display: inline-block;
            border-radius: 14px;
            padding: 11px 14px;
            border: 1px solid var(--border);
            background: var(--bubble-bot);
            position: relative;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: var(--text);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }

        .msg.bot .bubble {
            border-top-left-radius: 5px;
        }

        .msg.user .bubble {
            background: var(--bubble-user);
            color: #3b2a14;
            border-color: transparent;
            border-top-right-radius: 5px;
            box-shadow: 0 4px 16px rgba(217, 154, 63, 0.22);
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            padding: 0 2px;
        }

        .msg.user .meta {
            color: rgba(169, 151, 131, 0.9);
        }

        /* ===== 欢迎区 ===== */
        .bubble.welcome {
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 4px 2px;
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f7efdf;
            margin-bottom: 8px;
        }

        .welcome-title .accent {
            color: var(--brand);
        }

        .welcome-text {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
        }

        .suggestions {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .chip {
            border: 1px solid var(--border-strong);
            background: rgba(227, 176, 75, 0.06);
            color: #e6d4b2;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
            transition: all .18s ease;
            font-family: inherit;
        }

        .chip:hover {
            background: rgba(227, 176, 75, 0.16);
            border-color: rgba(227, 176, 75, 0.45);
            color: #f4dfa8;
            transform: translateY(-1px);
        }

        /* ===== 进度 ===== */
        details.progress {
            margin-top: 9px;
            border: 1px dashed rgba(227, 176, 75, 0.28);
            border-radius: 11px;
            padding: 8px 11px;
            background: rgba(23, 17, 13, 0.45);
        }

        details.progress summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-size: 12px;
        }

        .progress ul {
            margin: 8px 0 0 18px;
            padding: 0;
        }

        .progress li {
            margin: 4px 0;
            font-size: 12px;
            color: #a99783;
        }

        /* ===== 图片 ===== */
        .answer-images {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-images img {
            display: block;
            max-width: min(100%, 560px);
            max-height: 560px;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border-strong);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            background: rgba(23, 17, 13, 0.6);
        }

        .answer-images a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            word-break: break-all;
        }

        .bubble-img img {
            max-width: 160px;
            max-height: 160px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            margin-top: 8px;
            display: block;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        /* ===== 打字动画 ===== */
        .typing {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            padding: 2px 0;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e3b04b;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: .15s;
        }

        .dot:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .55;
            }
            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* ===== 输入区 ===== */
        .img-preview-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border-top: 1px solid var(--border);
            background: rgba(23, 17, 13, 0.4);
        }

        .img-preview-bar img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 9px;
            border: 1px solid var(--border-strong);
        }

        .img-preview-bar .img-name {
            flex: 1;
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .img-preview-bar .img-remove {
            background: none;
            border: none;
            color: #e08a6a;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 6px;
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(23, 17, 13, 0.55);
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 46px;
            max-height: 140px;
            padding: 12px 14px;
            border-radius: 13px;
            border: 1px solid var(--border-strong);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
            background: rgba(23, 17, 13, 0.6);
            color: var(--text);
            font-family: inherit;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        textarea:focus {
            border-color: rgba(227, 176, 75, 0.6);
            box-shadow: 0 0 0 3px rgba(227, 176, 75, 0.12);
        }

        textarea::placeholder {
            color: #7a6c5c;
        }

        .imgbtn {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            border: 1px solid var(--border-strong);
            border-radius: 13px;
            background: rgba(23, 17, 13, 0.6);
            color: #c9ab76;
            font-size: 19px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .imgbtn:hover {
            border-color: rgba(227, 176, 75, 0.55);
            color: var(--brand);
        }

        .imgbtn.active {
            border-color: var(--brand);
            color: var(--brand);
            box-shadow: 0 0 14px rgba(227, 176, 75, 0.3);
        }

        .send {
            width: 92px;
            height: 46px;
            border: none;
            border-radius: 13px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #3b2a14;
            background: linear-gradient(135deg, #f0c46a, #d99a3f);
            box-shadow: 0 0 16px rgba(227, 176, 75, 0.28);
            transition: all .2s ease;
            font-family: inherit;
        }

        .send:hover:not(:disabled) {
            filter: brightness(1.05);
            box-shadow: 0 0 20px rgba(227, 176, 75, 0.42);
        }

        .send:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .hint {
            padding: 0 16px 12px;
            color: var(--muted);
            font-size: 12px;
            background: transparent;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(23, 17, 13, 0.6);
            color: #a99783;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 5.4A2.4 2.4 0 0 1 6.4 3H11v15.6H6.4A2.4 2.4 0 0 0 4 21V5.4z" fill="#f0e6d6"/>
                    <path d="M20 5.4A2.4 2.4 0 0 0 17.6 3H13v15.6h4.6A2.4 2.4 0 0 1 20 21V5.4z" fill="#e4d5b8"/>
                    <path d="M12 3v15.6" stroke="#c98a3a" stroke-width="1.2"/>
                    <path d="M7 6.6h2.4M7 9.2h2.4" stroke="#c98a3a" stroke-width="0.9" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="title">
                <strong>掌柜智库</strong>
                <span id="subTitle">智能听书 · 书籍检索</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">📖</div>
            <div>
                <div class="bubble welcome">
                    <div class="welcome-title">你好，我是<span class="accent">掌柜智库</span></div>
                    <div class="welcome-text">你的智能听书知识库助手。可以找我荐书、查书、听书笔记，也可以上传封面图片直接找书。</div>
                </div>
                <div class="suggestions" id="suggestions">
                    <button class="chip" data-q="推荐几本科幻有声书">推荐几本科幻有声书</button>
                    <button class="chip" data-q="《活着》讲了什么">《活着》讲了什么</button>
                    <button class="chip" data-q="适合通勤听的悬疑小说">适合通勤听的悬疑小说</button>
                    <button class="chip" data-img="1">📷 上传封面找书</button>
                </div>
                <div class="meta">试试上面的示例，或直接在下方提问</div>
            </div>
        </div>
    </div>

    <div id="imgPreviewBar" class="img-preview-bar" style="display:none">
        <img id="imgPreviewImg" alt="">
        <span class="img-name" id="imgPreviewName"></span>
        <button class="img-remove" id="imgRemove">✕ 移除</button>
    </div>
    <div class="composer">
        <button class="imgbtn" id="imgBtn" title="上传图片搜索（封面检索）">📷</button>
        <input type="file" id="imgInput" accept="image/*" style="display:none">
        <textarea id="input" placeholder="搜一本书、问一个问题，或上传封面…"></textarea>
        <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
            class="kbd">Enter</span> 换行
    </div>
</div>

<script>

    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    // const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const API_BASE = 'http://127.0.0.1:8001'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');

    // 图片搜索（多模态封面检索）
    const imgBtn = document.getElementById('imgBtn');
    const imgInput = document.getElementById('imgInput');
    const imgPreviewBar = document.getElementById('imgPreviewBar');
    const imgPreviewImg = document.getElementById('imgPreviewImg');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const imgRemove = document.getElementById('imgRemove');
    let queryImageDataUrl = '';   // base64 data url（选中后暂存，发送时随 query 提交）

    imgBtn.addEventListener('click', () => imgInput.click());

    imgInput.addEventListener('change', (e) => {
        const f = e.target.files[0] || null;
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            queryImageDataUrl = ev.target.result;
            imgPreviewImg.src = ev.target.result;
            imgPreviewName.textContent = f.name;
            imgPreviewBar.style.display = 'flex';
            imgBtn.classList.add('active');
        };
        reader.readAsDataURL(f);
    });

    imgRemove.addEventListener('click', clearImage);

    function clearImage() {
        queryImageDataUrl = '';
        imgInput.value = '';
        imgPreviewImg.src = '';
        imgPreviewName.textContent = '';
        imgPreviewBar.style.display = 'none';
        imgBtn.classList.remove('active');
    }

    // 示例问题 chips：点击填入输入框；上传封面 chip 直接唤起图片选择
    document.querySelectorAll('#suggestions .chip').forEach((chip) => {
        chip.addEventListener('click', () => {
            if (chip.getAttribute('data-img') === '1') {
                imgInput.click();
                return;
            }
            inputEl.value = chip.getAttribute('data-q') || chip.textContent.trim();
            inputEl.focus();
        });
    });

    // 创建会话: 从localStorage获取sessionId
    // debugger
    let sessionId = localStorage.getItem('kb_session_id');
    // 不存在则创建
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        //存入localStorage
        localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];
        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};

        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];

        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }

        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
        const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

        const allImages = new Set([
            ...(hasBlockImages ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        containerEl.textContent = '';

        if ((text || '').trim().length > 0) {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = text;
            containerEl.appendChild(textEl);
        } else {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = '（已完成，但未返回答案）';
            containerEl.appendChild(textEl);
        }

        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }
    }

    function addUserMsg(text) {
        const imgHtml = queryImageDataUrl
            ? `<div class="bubble-img"><img src="${queryImageDataUrl}" alt="查询图片"></div>`
            : '';
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            ${imgHtml}
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">📖</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        }
        scrollToBottom();
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">📖</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        const details = botMsgEl.querySelector('details.progress');
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

        const lines = [
            ...done.map(x => `✅ ${x}`),
            ...running.map(x => `⏳ ${x}`)
        ];
        ul.innerHTML = '';
        if (lines.length === 0) {
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        } else {
            for (const line of lines) {
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) return;
            // 保留首条欢迎消息，其余先清空再渲染历史
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom();
        } catch (_) {
        }
    }

    async function submitQuery(text, imageDataUrl) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId,
                query_image: imageDataUrl || ''
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    async function onSend() {
        const text = (inputEl.value || '').trim();
        const hasImage = !!queryImageDataUrl;
        if (!text && !hasImage) return;
        inputEl.value = '';
        // 暂存本次发送的图片，随后清空输入区的图片状态
        const sentImage = queryImageDataUrl;
        addUserMsg(text || '（图片查询）');
        clearImage();
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        try {
            const data = await submitQuery(text, sentImage);

            // 渲染初始状态
            renderProgress(botMsgEl, [], [], 'pending');

            // 流式：SSE
            const {task_id} = data;

            const bubble = botMsgEl.querySelector('.bubble');
            let answerEl = bubble.querySelector('.answer');
            if (!answerEl) {
                answerEl = document.createElement('div');
                answerEl.className = 'answer';
                bubble.insertBefore(answerEl, bubble.firstChild);
            }

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    if (d && d.status === 'completed') {
                        const typing = botMsgEl.querySelector('.typing');
                        if (typing) typing.remove();
                        sendBtn.disabled = false;
                    }
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        scrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {

                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();

                const details = botMsgEl.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    details.removeAttribute('open');
                }

                try {
                    const d = JSON.parse(e.data || '{}');
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
                } catch (_) {
                }
                es.close();
                sendBtn.disabled = false;
            });

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();
                const progress = botMsgEl.querySelector('details.progress');
                if (progress) progress.removeAttribute('open');

                try {
                    const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
                    rawAnswerText += `\n\n（错误：${msg}）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                } catch (_) {
                    rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                }
                es.close();
                sendBtn.disabled = false;
            });
        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });
    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }

        // 清空除首条欢迎消息外的内容
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom();
    });

    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>

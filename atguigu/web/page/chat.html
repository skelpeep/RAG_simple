<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>掌柜智库 · 智能听书</title>
    <style>
        :root {
            --bg-0: #120c08;
            --bg-1: #1a130d;
            --panel: rgba(42, 32, 24, 0.66);
            --panel-2: rgba(24, 18, 13, 0.72);
            --text: #f6eddd;
            --text-2: #eadfc8;
            --muted: #a99681;
            --gold-1: #f7d488;
            --gold-2: #e6b456;
            --gold-3: #c98a3a;
            --accent: #d97a56;
            --gold-grad: linear-gradient(135deg, #f7d488 0%, #e6b456 48%, #c98a3a 100%);
            --border: rgba(246, 237, 221, 0.08);
            --border-strong: rgba(246, 237, 221, 0.14);
            --border-gold: rgba(230, 180, 86, 0.32);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.38);
            --shadow-lg: 0 28px 70px -14px rgba(0, 0, 0, 0.62);
            --glow-gold: 0 0 26px rgba(230, 180, 86, 0.30);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            font-family: "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: var(--bg-1);
            background-image:
                radial-gradient(1200px 600px at 12% -8%, rgba(247, 212, 136, 0.14), transparent 55%),
                radial-gradient(1000px 520px at 92% 4%, rgba(201, 138, 58, 0.13), transparent 52%),
                radial-gradient(900px 700px at 50% 116%, rgba(217, 122, 86, 0.10), transparent 55%),
                linear-gradient(to right, rgba(246, 237, 221, 0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(246, 237, 221, 0.022) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 46px 46px, 46px 46px;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            height: min(860px, 94vh);
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(1.1);
            -webkit-backdrop-filter: blur(18px) saturate(1.1);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(246, 237, 221, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶栏 ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 16px 20px;
            background: rgba(18, 12, 8, 0.55);
            border-bottom: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }

        .topbar::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent 2%, var(--gold-2) 50%, transparent 98%);
            opacity: 0.6;
            pointer-events: none;
        }

        .brand { display: flex; align-items: center; gap: 12px; min-width: 260px; }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(150deg, rgba(247, 212, 136, 0.22), rgba(201, 138, 58, 0.12));
            border: 1px solid var(--border-gold);
            box-shadow: var(--glow-gold), inset 0 1px 0 rgba(246, 237, 221, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title { display: flex; flex-direction: column; line-height: 1.2; }
        .title strong {
            font-size: 16px;
            letter-spacing: 0.6px;
            font-weight: 700;
            background: linear-gradient(135deg, #fdf3dd, #e6b456);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .title span { font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: 0.4px; }

        .top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

        .pill {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border-strong);
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(24, 18, 13, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pill::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6c6a63;
            box-shadow: 0 0 0 3px rgba(108, 106, 99, 0.2);
        }
        .pill.on { color: #9fdcb2; }
        .pill.on::before { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2), 0 0 10px rgba(52, 211, 153, 0.6); }

        .btn {
            border: 1px solid var(--border-strong);
            background: rgba(230, 180, 86, 0.08);
            color: var(--gold-2);
            padding: 8px 15px;
            border-radius: 11px;
            font-size: 13px;
            cursor: pointer;
            transition: all .22s ease;
            font-family: inherit;
        }
        .btn:hover { background: rgba(230, 180, 86, 0.16); border-color: var(--border-gold); transform: translateY(-1px); }

        /* ===== 聊天区 ===== */
        .chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 18px 12px;
            background: rgba(18, 12, 8, 0.24);
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar { width: 9px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb { background: rgba(169, 150, 129, 0.22); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
        .chat::-webkit-scrollbar-thumb:hover { background: rgba(230, 180, 86, 0.4); border: 2px solid transparent; background-clip: padding-box; }

        .dayline { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 18px; letter-spacing: 2px; }

        .msg { display: flex; gap: 12px; margin: 14px 0; align-items: flex-end; animation: fadeUp .35s ease both; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user { justify-content: flex-end; }
        .msg > div:not(.avatar) { flex: 1; min-width: 0; }
        .msg.user > div:not(.avatar) { display: flex; flex-direction: column; align-items: flex-end; }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(230, 180, 86, 0.10);
            border: 1px solid rgba(230, 180, 86, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--gold-2);
            flex: 0 0 auto;
            user-select: none;
        }
        .avatar.bot {
            background: linear-gradient(150deg, rgba(247, 212, 136, 0.20), rgba(201, 138, 58, 0.10));
            box-shadow: 0 0 16px rgba(230, 180, 86, 0.16);
        }

        .bubble {
            max-width: min(730px, 78%);
            display: inline-block;
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid var(--border-strong);
            background: var(--panel-2);
            position: relative;
            line-height: 1.65;
            font-size: 14.5px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: var(--text);
            box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(246, 237, 221, 0.04);
        }

        .msg.bot .bubble { border-top-left-radius: 6px; }
        .msg.user .bubble {
            background: var(--gold-grad);
            color: #3a2812;
            border-color: transparent;
            border-top-right-radius: 6px;
            box-shadow: 0 6px 22px rgba(201, 138, 58, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            font-weight: 500;
        }

        .meta { font-size: 11px; color: var(--muted); margin-top: 7px; padding: 0 3px; }
        .msg.user .meta { color: rgba(169, 150, 129, 0.92); }

        /* ===== 欢迎区 ===== */
        .bubble.welcome { border: none; background: transparent; box-shadow: none; padding: 6px 2px; }
        .welcome-title { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 10px; }
        .welcome-title .accent {
            background: var(--gold-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome-text { font-size: 14.5px; color: var(--text-2); line-height: 1.75; }

        .suggestions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
        .chip {
            border: 1px solid var(--border-gold);
            background: rgba(230, 180, 86, 0.06);
            color: #e8d5ab;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s ease;
            font-family: inherit;
            backdrop-filter: blur(6px);
        }
        .chip:hover {
            background: rgba(230, 180, 86, 0.16);
            border-color: var(--gold-2);
            color: #f8e8c0;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(230, 180, 86, 0.22);
        }

        /* ===== 进度 ===== */
        details.progress {
            margin-top: 10px;
            border: 1px dashed rgba(230, 180, 86, 0.28);
            border-radius: 12px;
            padding: 9px 12px;
            background: rgba(18, 12, 8, 0.42);
        }
        details.progress summary { cursor: pointer; user-select: none; color: var(--muted); font-size: 12px; }
        .progress ul { margin: 8px 0 0 18px; padding: 0; }
        .progress li { margin: 5px 0; font-size: 12px; color: #a99681; }

        /* ===== 图片 ===== */
        .answer-images { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .answer-images img {
            display: block;
            max-width: min(100%, 560px);
            max-height: 560px;
            width: auto;
            height: auto;
            border-radius: 14px;
            border: 1px solid var(--border-strong);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
            background: rgba(18, 12, 8, 0.6);
        }
        .answer-images a { font-size: 12px; color: var(--muted); text-decoration: none; word-break: break-all; }

        .bubble-img img {
            max-width: 168px;
            max-height: 168px;
            border-radius: 12px;
            border: 1px solid var(--border-strong);
            margin-top: 8px;
            display: block;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.34);
        }

        /* ===== 打字动画 ===== */
        .typing { display: inline-flex; gap: 6px; align-items: center; padding: 3px 0; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-2); animation: bounce 1.2s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: .15s; }
        .dot:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(-5px); opacity: 1; } }

        /* ===== 图片预览条 ===== */
        .img-preview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 18px;
            border-top: 1px solid var(--border);
            background: rgba(18, 12, 8, 0.4);
            flex-shrink: 0;
        }
        .img-preview-bar img { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border-strong); }
        .img-preview-bar .img-name { flex: 1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .img-preview-bar .img-remove { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 4px 7px; transition: color .2s; }
        .img-preview-bar .img-remove:hover { color: #ef9a72; }

        /* ===== 输入区 ===== */
        .composer {
            border-top: 1px solid var(--border);
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: rgba(18, 12, 8, 0.5);
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            padding: 13px 16px;
            border-radius: 15px;
            border: 1px solid var(--border-strong);
            outline: none;
            font-size: 14.5px;
            line-height: 1.55;
            background: rgba(18, 12, 8, 0.62);
            color: var(--text);
            font-family: inherit;
            transition: border-color .22s ease, box-shadow .22s ease;
        }
        textarea:focus { border-color: rgba(230, 180, 86, 0.6); box-shadow: 0 0 0 4px rgba(230, 180, 86, 0.12), var(--glow-gold); }
        textarea::placeholder { color: #7c6c59; }

        .imgbtn {
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            border: 1px solid var(--border-strong);
            border-radius: 15px;
            background: rgba(18, 12, 8, 0.62);
            color: #c9ab76;
            font-size: 20px;
            cursor: pointer;
            transition: all .22s ease;
        }
        .imgbtn:hover { border-color: var(--border-gold); color: var(--gold-2); transform: translateY(-1px); }
        .imgbtn.active { border-color: var(--gold-2); color: var(--gold-2); box-shadow: var(--glow-gold); }

        .send {
            width: 96px;
            height: 48px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #3a2812;
            background: var(--gold-grad);
            box-shadow: 0 0 20px rgba(230, 180, 86, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all .22s ease;
            font-family: inherit;
        }
        .send:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 0 28px rgba(230, 180, 86, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.4); transform: translateY(-1px); }
        .send:active:not(:disabled) { transform: translateY(0); }
        .send:disabled { opacity: .5; cursor: not-allowed; }

        .hint { padding: 0 18px 12px; color: var(--muted); font-size: 12px; background: transparent; flex-shrink: 0; }
        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid var(--border-strong);
            padding: 1px 7px;
            border-radius: 6px;
            background: rgba(18, 12, 8, 0.6);
            color: #a99681;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 5.4A2.4 2.4 0 0 1 6.4 3H11v15.6H6.4A2.4 2.4 0 0 0 4 21V5.4z" fill="url(#g1)"/>
                    <path d="M20 5.4A2.4 2.4 0 0 0 17.6 3H13v15.6h4.6A2.4 2.4 0 0 1 20 21V5.4z" fill="url(#g2)"/>
                    <path d="M12 3v15.6" stroke="#c98a3a" stroke-width="1.1"/>
                    <path d="M7 6.8h2.3M7 9.4h2.3" stroke="#c98a3a" stroke-width="0.9" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="g1" x1="4" y1="3" x2="11" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#f7d488"/><stop offset="1" stop-color="#e6b456"/></linearGradient>
                        <linearGradient id="g2" x1="20" y1="3" x2="13" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#e6b456"/><stop offset="1" stop-color="#c98a3a"/></linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="title">
                <strong>掌柜智库</strong>
                <span id="subTitle">智能听书 · 书籍检索</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">📖</div>
            <div>
                <div class="bubble welcome">
                    <div class="welcome-title">你好，我是<span class="accent">掌柜智库</span></div>
                    <div class="welcome-text">你的智能听书知识库助手。可以找我荐书、查书、听书笔记，也可以上传封面图片直接找书。</div>
                </div>
                <div class="suggestions" id="suggestions">
                    <button class="chip" data-q="推荐几本科幻有声书">推荐几本科幻有声书</button>
                    <button class="chip" data-q="《活着》讲了什么">《活着》讲了什么</button>
                    <button class="chip" data-q="适合通勤听的悬疑小说">适合通勤听的悬疑小说</button>
                    <button class="chip" data-img="1">📷 上传封面找书</button>
                </div>
                <div class="meta">试试上面的示例，或直接在下方提问</div>
            </div>
        </div>
    </div>

    <div id="imgPreviewBar" class="img-preview-bar" style="display:none">
        <img id="imgPreviewImg" alt="">
        <span class="img-name" id="imgPreviewName"></span>
        <button class="img-remove" id="imgRemove">✕ 移除</button>
    </div>
    <div class="composer">
        <button class="imgbtn" id="imgBtn" title="上传图片搜索（封面检索）">📷</button>
        <input type="file" id="imgInput" accept="image/*" style="display:none">
        <textarea id="input" placeholder="搜一本书、问一个问题，或上传封面…"></textarea>
        <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
            class="kbd">Enter</span> 换行
    </div>
</div>

<script>

    const API_BASE = 'http://127.0.0.1:8001'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');

    // 图片搜索（多模态封面检索）
    const imgBtn = document.getElementById('imgBtn');
    const imgInput = document.getElementById('imgInput');
    const imgPreviewBar = document.getElementById('imgPreviewBar');
    const imgPreviewImg = document.getElementById('imgPreviewImg');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const imgRemove = document.getElementById('imgRemove');
    let queryImageDataUrl = '';

    imgBtn.addEventListener('click', () => imgInput.click());

    imgInput.addEventListener('change', (e) => {
        const f = e.target.files[0] || null;
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            queryImageDataUrl = ev.target.result;
            imgPreviewImg.src = ev.target.result;
            imgPreviewName.textContent = f.name;
            imgPreviewBar.style.display = 'flex';
            imgBtn.classList.add('active');
        };
        reader.readAsDataURL(f);
    });

    imgRemove.addEventListener('click', clearImage);

    function clearImage() {
        queryImageDataUrl = '';
        imgInput.value = '';
        imgPreviewImg.src = '';
        imgPreviewName.textContent = '';
        imgPreviewBar.style.display = 'none';
        imgBtn.classList.remove('active');
    }

    document.querySelectorAll('#suggestions .chip').forEach((chip) => {
        chip.addEventListener('click', () => {
            if (chip.getAttribute('data-img') === '1') {
                imgInput.click();
                return;
            }
            inputEl.value = chip.getAttribute('data-q') || chip.textContent.trim();
            inputEl.focus();
        });
    });

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];
        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};

        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];

        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }

        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
        const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

        const allImages = new Set([
            ...(hasBlockImages ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        containerEl.textContent = '';

        if ((text || '').trim().length > 0) {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = text;
            containerEl.appendChild(textEl);
        } else {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = '（已完成，但未返回答案）';
            containerEl.appendChild(textEl);
        }

        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }
    }

    function addUserMsg(text) {
        const imgHtml = queryImageDataUrl
            ? `<div class="bubble-img"><img src="${queryImageDataUrl}" alt="查询图片"></div>`
            : '';
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            ${imgHtml}
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">📖</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        }
        scrollToBottom();
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">📖</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        const details = botMsgEl.querySelector('details.progress');
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

        const lines = [
            ...done.map(x => `✅ ${x}`),
            ...running.map(x => `⏳ ${x}`)
        ];
        ul.innerHTML = '';
        if (lines.length === 0) {
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        } else {
            for (const line of lines) {
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
        apiPill.classList.add('on');
      }catch(e){
        apiPill.textContent = `API: 未连接`;
        apiPill.classList.remove('on');
      }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) return;
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom();
        } catch (_) {
        }
    }

    async function submitQuery(text, imageDataUrl) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId,
                query_image: imageDataUrl || ''
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    async function onSend() {
        const text = (inputEl.value || '').trim();
        const hasImage = !!queryImageDataUrl;
        if (!text && !hasImage) return;
        inputEl.value = '';
        const sentImage = queryImageDataUrl;
        addUserMsg(text || '（图片查询）');
        clearImage();
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        try {
            const data = await submitQuery(text, sentImage);
            renderProgress(botMsgEl, [], [], 'pending');
            const {task_id} = data;

            const bubble = botMsgEl.querySelector('.bubble');
            let answerEl = bubble.querySelector('.answer');
            if (!answerEl) {
                answerEl = document.createElement('div');
                answerEl.className = 'answer';
                bubble.insertBefore(answerEl, bubble.firstChild);
            }

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    if (d && d.status === 'completed') {
                        const typing = botMsgEl.querySelector('.typing');
                        if (typing) typing.remove();
                        sendBtn.disabled = false;
                    }
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        scrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();

                const details = botMsgEl.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    details.removeAttribute('open');
                }

                try {
                    const d = JSON.parse(e.data || '{}');
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
                } catch (_) {
                }
                es.close();
                sendBtn.disabled = false;
            });

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();
                const progress = botMsgEl.querySelector('details.progress');
                if (progress) progress.removeAttribute('open');

                try {
                    const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
                    rawAnswerText += `\n\n（错误：${msg}）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                } catch (_) {
                    rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                }
                es.close();
                sendBtn.disabled = false;
            });
        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });
    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }

        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom();
    });

    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>

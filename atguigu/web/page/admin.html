<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>智能听书知识库 · 管理后台</title>
    <style>
        :root {
            --bg-0: #120c08;
            --bg-1: #1a130d;
            --panel: rgba(42, 32, 24, 0.66);
            --panel-2: rgba(24, 18, 13, 0.72);
            --text: #f6eddd;
            --text-2: #eadfc8;
            --muted: #a99681;
            --gold-1: #f7d488;
            --gold-2: #e6b456;
            --gold-3: #c98a3a;
            --accent: #d97a56;
            --gold-grad: linear-gradient(135deg, #f7d488 0%, #e6b456 48%, #c98a3a 100%);
            --border: rgba(246, 237, 221, 0.08);
            --border-strong: rgba(246, 237, 221, 0.14);
            --border-gold: rgba(230, 180, 86, 0.32);
            --green: #34d399;
            --red: #f87171;
            --amber: #fbbf24;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.38);
            --shadow-lg: 0 28px 70px -14px rgba(0, 0, 0, 0.62);
            --glow-gold: 0 0 26px rgba(230, 180, 86, 0.30);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            background-color: var(--bg-1);
            background-image:
                radial-gradient(1200px 600px at 12% -8%, rgba(247, 212, 136, 0.14), transparent 55%),
                radial-gradient(1000px 520px at 92% 4%, rgba(201, 138, 58, 0.13), transparent 52%),
                radial-gradient(900px 700px at 50% 116%, rgba(217, 122, 86, 0.10), transparent 55%),
                linear-gradient(to right, rgba(246, 237, 221, 0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(246, 237, 221, 0.022) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 46px 46px, 46px 46px;
        }

        .wrap { max-width: 1220px; margin: 0 auto; }

        /* ===== 顶栏 ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(1.1);
            -webkit-backdrop-filter: blur(18px) saturate(1.1);
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(246, 237, 221, 0.06);
            margin-bottom: 18px;
            position: relative;
        }
        .topbar::after {
            content: "";
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
            opacity: 0.5;
            pointer-events: none;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(150deg, rgba(247, 212, 136, 0.22), rgba(201, 138, 58, 0.12));
            border: 1px solid var(--border-gold);
            box-shadow: var(--glow-gold), inset 0 1px 0 rgba(246, 237, 221, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title { line-height: 1.25; }
        .title strong {
            display: block;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fdf3dd, #e6b456);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .title span { font-size: 12px; color: var(--muted); letter-spacing: 0.4px; }

        .top-actions { margin-left: auto; display: flex; gap: 10px; }

        .btn {
            border: 1px solid var(--border-strong);
            background: var(--gold-grad);
            color: #3a2812;
            padding: 10px 18px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .22s ease;
            font-family: inherit;
            box-shadow: 0 0 16px rgba(230, 180, 86, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 0 22px rgba(230, 180, 86, 0.38); }
        .btn.ghost {
            background: rgba(230, 180, 86, 0.08);
            border: 1px solid var(--border-strong);
            color: var(--gold-2);
            box-shadow: none;
        }
        .btn.ghost:hover { background: rgba(230, 180, 86, 0.16); border-color: var(--border-gold); box-shadow: none; }
        .btn.danger { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff; box-shadow: 0 0 16px rgba(220, 38, 38, 0.3); }

        /* ===== 统计卡片 ===== */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 20px 22px;
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-sm);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(280px 100px at 50% 0%, rgba(230, 180, 86, 0.08), transparent 70%);
            opacity: 0;
            transition: opacity .25s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-gold); }
        .stat-card:hover::before { opacity: 1; }

        .stat-card .num {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.1;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: 0.3px; }
        .stat-card .dist { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 7px; }

        .chip {
            font-size: 12px;
            color: #e8d5ab;
            border: 1px solid var(--border-gold);
            background: rgba(230, 180, 86, 0.08);
            padding: 4px 11px;
            border-radius: 999px;
        }

        /* ===== 标签页 ===== */
        .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab {
            padding: 11px 24px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            color: var(--muted);
            border: 1px solid var(--border-strong);
            background: var(--panel-2);
            transition: all .22s ease;
            user-select: none;
        }
        .tab:hover { border-color: var(--border-gold); color: var(--gold-2); }
        .tab.active {
            color: #3a2812;
            background: var(--gold-grad);
            border-color: transparent;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(230, 180, 86, 0.3);
        }

        /* ===== 面板 ===== */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            background: rgba(18, 12, 8, 0.22);
        }
        .filters input, .filters select {
            background: rgba(18, 12, 8, 0.6);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 10px 13px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .filters input:focus, .filters select:focus { border-color: rgba(230, 180, 86, 0.6); box-shadow: 0 0 0 3px rgba(230, 180, 86, 0.12); }
        .filters input::placeholder { color: #7c6c59; }
        .filters .kw { flex: 1; min-width: 200px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: .5px;
            white-space: nowrap;
            background: rgba(18, 12, 8, 0.28);
        }
        tr { transition: background .18s ease; }
        tr:hover td { background: rgba(230, 180, 86, 0.05); }
        td.muted { color: var(--muted); }
        .content-cell { max-width: 420px; color: var(--text-2); line-height: 1.6; }
        .content-cell .clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .row-actions { display: flex; gap: 7px; white-space: nowrap; }
        .link-btn {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--gold-2);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .link-btn:hover { background: rgba(230, 180, 86, 0.12); border-color: var(--border-gold); }
        .link-btn.danger { color: var(--red); border-color: rgba(248, 113, 113, 0.35); }
        .link-btn.danger:hover { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.6); }

        .empty { padding: 56px 20px; text-align: center; color: var(--muted); }

        .pager {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
        }
        .pager button {
            background: var(--panel-2);
            border: 1px solid var(--border-strong);
            color: var(--text-2);
            padding: 7px 14px;
            border-radius: 9px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .pager button:hover:not(:disabled) { border-color: var(--border-gold); color: var(--gold-2); }
        .pager button:disabled { opacity: .4; cursor: not-allowed; }
        .pager .info { margin-left: auto; }

        /* ===== 弹窗 ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 500px;
            max-width: 92vw;
            background: rgba(42, 32, 24, 0.96);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 26px;
            box-shadow: var(--shadow-lg);
            animation: popIn .25s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal h3 { margin: 0 0 18px; font-size: 17px; font-weight: 700; background: linear-gradient(135deg, #fdf3dd, #e6b456); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .modal .field { margin-bottom: 14px; }
        .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .modal input, .modal select {
            width: 100%;
            background: rgba(18, 12, 8, 0.6);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 11px 13px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .modal input:focus, .modal select:focus { border-color: rgba(230, 180, 86, 0.6); box-shadow: 0 0 0 3px rgba(230, 180, 86, 0.12); }
        .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* ===== 提示 ===== */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(42, 32, 24, 0.96);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 13px;
            box-shadow: var(--shadow-md);
            opacity: 0;
            transition: all .28s ease;
            z-index: 100;
            max-width: 90vw;
            backdrop-filter: blur(10px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: rgba(52, 211, 153, 0.5); color: #a9e8c4; }
        .toast.err { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }
        .toast.warn { border-color: rgba(251, 191, 36, 0.5); color: #fde68a; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="logo">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 5.4A2.4 2.4 0 0 1 6.4 3H11v15.6H6.4A2.4 2.4 0 0 0 4 21V5.4z" fill="#f7d488"/>
                <path d="M20 5.4A2.4 2.4 0 0 0 17.6 3H13v15.6h4.6A2.4 2.4 0 0 1 20 21V5.4z" fill="#e6b456"/>
                <path d="M12 3v15.6" stroke="#c98a3a" stroke-width="1.1"/>
                <path d="M7 6.8h2.3M7 9.4h2.3" stroke="#c98a3a" stroke-width="0.9" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="title">
            <strong>智能听书知识库 · 管理后台</strong>
            <span id="subTitle">书籍资料管理 &amp; 知识库内容管理</span>
        </div>
        <div class="top-actions">
            <button class="btn ghost" id="btnRefresh">刷新</button>
            <button class="btn" id="btnGoImport">前往导入</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="num" id="statBooks">-</div>
            <div class="label">书籍 / 条目主体总数</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statChunks">-</div>
            <div class="label">知识库切片总数</div>
        </div>
        <div class="stat-card">
            <div class="num" style="font-size:18px; line-height:36px;" id="statTypes">-</div>
            <div class="label">内容类型分布</div>
            <div class="dist" id="statDist"></div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="books" onclick="switchTab('books')">📖 书籍管理</div>
        <div class="tab" data-tab="chunks" onclick="switchTab('chunks')">🧩 知识库管理</div>
    </div>

    <!-- 书籍管理 -->
    <div class="panel" id="panel-books">
        <div class="filters">
            <input class="kw" id="bookKw" placeholder="搜索条目 / 书名 / 作者 / 类别 / 来源文件"/>
            <select id="bookType">
                <option value="">全部内容类型</option>
            </select>
            <button class="btn" onclick="searchBooks()">查询</button>
            <button class="btn ghost" onclick="resetBooks()">重置</button>
        </div>
        <div id="booksTableWrap"></div>
        <div class="pager" id="booksPager"></div>
    </div>

    <!-- 知识库管理 -->
    <div class="panel" id="panel-chunks" style="display:none;">
        <div class="filters">
            <input class="kw" id="chunkKw" placeholder="搜索条目 / 书名 / 标题 / 正文 / 作者"/>
            <input id="chunkItemName" placeholder="条目名称" style="width:150px;"/>
            <input id="chunkBookName" placeholder="书名" style="width:120px;"/>
            <select id="chunkType">
                <option value="">全部内容类型</option>
            </select>
            <input id="chunkFileTitle" placeholder="来源文件名" style="width:160px;"/>
            <button class="btn" onclick="searchChunks()">查询</button>
            <button class="btn ghost" onclick="resetChunks()">重置</button>
            <button class="btn danger" onclick="batchDeleteChunks()">按条件批量删除</button>
        </div>
        <div id="chunksTableWrap"></div>
        <div class="pager" id="chunksPager"></div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask">
    <div class="modal">
        <h3 id="editTitle">编辑书籍资料</h3>
        <input type="hidden" id="editId"/>
        <div class="field">
            <label>条目名称（如：刘慈欣《三体》）</label>
            <input id="editItemName"/>
        </div>
        <div class="field">
            <label>书名</label>
            <input id="editBookName"/>
        </div>
        <div class="field">
            <label>作者名</label>
            <input id="editAuthor"/>
        </div>
        <div class="field">
            <label>内容类型</label>
            <select id="editContentType"></select>
        </div>
        <div class="field">
            <label>类别 / 标签（多个用中文逗号分隔）</label>
            <input id="editCategory"/>
        </div>
        <div class="actions">
            <button class="btn ghost" onclick="closeEdit()">取消</button>
            <button class="btn" onclick="submitEdit()">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const ADMIN_ORIGIN = (location.port === '8002') ? '' : 'http://127.0.0.1:8002';
    const API_BASE = ADMIN_ORIGIN;
    const CONTENT_TYPES = ['有声书信息', '书籍简介', '作者介绍', '听书笔记', '推荐运营资料', '用户评论摘要', '常见问答'];

    const state = { tab: 'books', booksPage: 0, chunksPage: 0, pageSize: 20 };

    function escapeHtml(str) {
        return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function toast(msg, type = 'ok') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show ' + type;
        clearTimeout(el._t);
        el._t = setTimeout(() => el.className = 'toast ' + type, 2600);
    }

    async function api(path, opts = {}) {
        const res = await fetch(API_BASE + path, opts);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
    }

    function fillTypeSelect(selectEl, includeEmpty = true) {
        const cur = selectEl.value;
        selectEl.innerHTML = '';
        if (includeEmpty) {
            const o = document.createElement('option');
            o.value = '';
            o.textContent = '全部内容类型';
            selectEl.appendChild(o);
        }
        for (const ct of CONTENT_TYPES) {
            const o = document.createElement('option');
            o.value = ct;
            o.textContent = ct;
            selectEl.appendChild(o);
        }
        selectEl.value = cur;
    }

    async function loadStats() {
        try {
            const d = await api('/api/stats');
            document.getElementById('statBooks').textContent = d.total_books;
            document.getElementById('statChunks').textContent = d.total_chunks;
            const dist = d.content_type_dist || {};
            const keys = Object.keys(dist);
            document.getElementById('statTypes').textContent = keys.length + ' 类';
            const box = document.getElementById('statDist');
            box.innerHTML = '';
            for (const k of keys) {
                box.insertAdjacentHTML('beforeend', `<span class="chip">${escapeHtml(k)} ${dist[k]}</span>`);
            }
        } catch (e) {
            toast('统计加载失败：' + e.message, 'err');
        }
    }

    async function loadBooks() {
        const kw = document.getElementById('bookKw').value.trim();
        const ct = document.getElementById('bookType').value;
        const qs = new URLSearchParams({keyword: kw, content_type: ct, limit: state.pageSize, offset: state.booksPage * state.pageSize});
        try {
            const d = await api('/api/books?' + qs.toString());
            renderBooks(d);
        } catch (e) {
            toast('书籍列表加载失败：' + e.message, 'err');
        }
    }

    function renderBooks(d) {
        const wrap = document.getElementById('booksTableWrap');
        if (!d.items || d.items.length === 0) {
            wrap.innerHTML = '<div class="empty">暂无书籍数据，请先到「导入」页上传文件</div>';
            document.getElementById('booksPager').innerHTML = '';
            return;
        }
        let html = '<table><thead><tr><th>条目名称</th><th>书名</th><th>作者</th><th>内容类型</th><th>类别/标签</th><th>来源文件</th><th>操作</th></tr></thead><tbody>';
        for (const b of d.items) {
            html += `<tr>
                <td>${escapeHtml(b.item_name)}</td>
                <td>${escapeHtml(b.book_name) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(b.author) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(b.content_type) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(b.category) || '<span class="muted">-</span>'}</td>
                <td class="muted">${escapeHtml(b.file_title)}</td>
                <td><div class="row-actions">
                    <button class="link-btn" onclick="openEdit('${b.id}')">编辑</button>
                    <button class="link-btn danger" onclick="deleteBook('${b.id}')">删除</button>
                </div></td>
            </tr>`;
        }
        html += '</tbody></table>';
        wrap.innerHTML = html;
        renderPager('booksPager', d.total, state.booksPage, (p) => { state.booksPage = p; loadBooks(); });
    }

    function searchBooks() { state.booksPage = 0; loadBooks(); }
    function resetBooks() {
        document.getElementById('bookKw').value = '';
        document.getElementById('bookType').value = '';
        searchBooks();
    }

    async function deleteBook(id) {
        if (!confirm('确定删除该书籍主体及其名下所有切片吗？此操作不可恢复。')) return;
        try {
            const d = await api('/api/books/' + id, {method: 'DELETE'});
            toast(d.msg + (d.deleted_chunks ? `，已删除 ${d.deleted_chunks} 条切片` : ''), d.ok ? 'ok' : 'err');
            loadBooks(); loadStats();
        } catch (e) {
            toast('删除失败：' + e.message, 'err');
        }
    }

    function openEdit(id) {
        api('/api/books/' + id).then(d => {
            if (!d.ok) { toast(d.msg, 'err'); return; }
            const b = d.book;
            document.getElementById('editId').value = b.id;
            document.getElementById('editItemName').value = b.item_name || '';
            document.getElementById('editBookName').value = b.book_name || '';
            document.getElementById('editAuthor').value = b.author || '';
            document.getElementById('editCategory').value = b.category || '';
            const sel = document.getElementById('editContentType');
            sel.innerHTML = '';
            for (const ct of CONTENT_TYPES) {
                const o = document.createElement('option');
                o.value = ct; o.textContent = ct;
                sel.appendChild(o);
            }
            sel.value = b.content_type || '';
            document.getElementById('editMask').classList.add('show');
        }).catch(e => toast('加载书籍详情失败：' + e.message, 'err'));
    }

    function closeEdit() { document.getElementById('editMask').classList.remove('show'); }

    async function submitEdit() {
        const id = document.getElementById('editId').value;
        const body = {
            item_name: document.getElementById('editItemName').value.trim(),
            book_name: document.getElementById('editBookName').value.trim(),
            author: document.getElementById('editAuthor').value.trim(),
            content_type: document.getElementById('editContentType').value,
            category: document.getElementById('editCategory').value.trim(),
        };
        if (!body.item_name) { toast('条目名称不能为空', 'err'); return; }
        try {
            const d = await api('/api/books/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (d.ok) {
                toast(d.warning ? d.warning : d.msg, d.warning ? 'warn' : 'ok');
                closeEdit();
                loadBooks(); loadStats();
            } else {
                toast(d.msg, 'err');
            }
        } catch (e) {
            toast('保存失败：' + e.message, 'err');
        }
    }

    async function loadChunks() {
        const qs = new URLSearchParams({
            keyword: document.getElementById('chunkKw').value.trim(),
            item_name: document.getElementById('chunkItemName').value.trim(),
            book_name: document.getElementById('chunkBookName').value.trim(),
            content_type: document.getElementById('chunkType').value,
            file_title: document.getElementById('chunkFileTitle').value.trim(),
            limit: state.pageSize, offset: state.chunksPage * state.pageSize
        });
        try {
            const d = await api('/api/chunks?' + qs.toString());
            renderChunks(d);
        } catch (e) {
            toast('切片列表加载失败：' + e.message, 'err');
        }
    }

    function renderChunks(d) {
        const wrap = document.getElementById('chunksTableWrap');
        if (!d.items || d.items.length === 0) {
            wrap.innerHTML = '<div class="empty">暂无切片数据</div>';
            document.getElementById('chunksPager').innerHTML = '';
            return;
        }
        let html = '<table><thead><tr><th>条目</th><th>书名</th><th>作者</th><th>类型</th><th>时长</th><th>来源文件</th><th>正文摘要</th><th>操作</th></tr></thead><tbody>';
        for (const c of d.items) {
            html += `<tr>
                <td>${escapeHtml(c.item_name) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(c.book_name) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(c.author) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(c.content_type) || '<span class="muted">-</span>'}</td>
                <td>${escapeHtml(c.duration) || '<span class="muted">-</span>'}</td>
                <td class="muted">${escapeHtml(c.file_title)}</td>
                <td class="content-cell"><div class="clip" title="${escapeHtml(c.content)}">${escapeHtml(c.content)}</div></td>
                <td><div class="row-actions"><button class="link-btn danger" onclick="deleteChunk('${c.id}')">删除</button></div></td>
            </tr>`;
        }
        html += '</tbody></table>';
        wrap.innerHTML = html;
        renderPager('chunksPager', d.total, state.chunksPage, (p) => { state.chunksPage = p; loadChunks(); });
    }

    function searchChunks() { state.chunksPage = 0; loadChunks(); }
    function resetChunks() {
        document.getElementById('chunkKw').value = '';
        document.getElementById('chunkItemName').value = '';
        document.getElementById('chunkBookName').value = '';
        document.getElementById('chunkType').value = '';
        document.getElementById('chunkFileTitle').value = '';
        searchChunks();
    }

    async function deleteChunk(id) {
        if (!confirm('确定删除该条切片吗？')) return;
        try {
            const d = await api('/api/chunks/' + id, {method: 'DELETE'});
            toast(d.msg, d.ok ? 'ok' : 'err');
            loadChunks(); loadStats();
        } catch (e) {
            toast('删除失败：' + e.message, 'err');
        }
    }

    async function batchDeleteChunks() {
        const body = {
            item_name: document.getElementById('chunkItemName').value.trim(),
            book_name: document.getElementById('chunkBookName').value.trim(),
            content_type: document.getElementById('chunkType').value,
            file_title: document.getElementById('chunkFileTitle').value.trim(),
        };
        const hasFilter = Object.values(body).some(v => v);
        if (!hasFilter) { toast('请至少填写一个过滤条件（条目/书名/类型/来源文件）再批量删除', 'err'); return; }
        if (!confirm('将按当前过滤条件批量删除切片，确定继续吗？')) return;
        try {
            const d = await api('/api/chunks', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            toast(d.msg + (d.deleted !== undefined ? `，共 ${d.deleted} 条` : ''), d.ok ? 'ok' : 'err');
            loadChunks(); loadStats();
        } catch (e) {
            toast('批量删除失败：' + e.message, 'err');
        }
    }

    function renderPager(elId, total, page, onChange) {
        const el = document.getElementById(elId);
        const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
        el.innerHTML = `
            <button ${page <= 0 ? 'disabled' : ''} onclick="void 0">« 上一页</button>
            <span>第 ${page + 1} / ${totalPages} 页</span>
            <button ${page + 1 >= totalPages ? 'disabled' : ''}>下一页 »</button>
            <span class="info">共 ${total} 条</span>`;
        const [prev, next] = el.querySelectorAll('button');
        prev.onclick = () => { if (page > 0) onChange(page - 1); };
        next.onclick = () => { if (page + 1 < totalPages) onChange(page + 1); };
    }

    function switchTab(tab) {
        state.tab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        document.getElementById('panel-books').style.display = tab === 'books' ? '' : 'none';
        document.getElementById('panel-chunks').style.display = tab === 'chunks' ? '' : 'none';
        if (tab === 'books') loadBooks();
        else loadChunks();
    }

    document.getElementById('btnRefresh').onclick = () => { loadStats(); state.tab === 'books' ? loadBooks() : loadChunks(); };
    document.getElementById('btnGoImport').onclick = () => { window.open(ADMIN_ORIGIN + '/page/import.html', '_blank'); };

    fillTypeSelect(document.getElementById('bookType'));
    fillTypeSelect(document.getElementById('chunkType'));

    document.getElementById('bookKw').addEventListener('keydown', e => { if (e.key === 'Enter') searchBooks(); });
    document.getElementById('chunkKw').addEventListener('keydown', e => { if (e.key === 'Enter') searchChunks(); });

    loadStats();
    loadBooks();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件导入服务</title>
    <style>
        :root {
            --bg-0: #120c08;
            --bg-1: #1a130d;
            --panel: rgba(42, 32, 24, 0.66);
            --panel-2: rgba(24, 18, 13, 0.72);
            --text: #f6eddd;
            --text-2: #eadfc8;
            --muted: #a99681;
            --gold-1: #f7d488;
            --gold-2: #e6b456;
            --gold-3: #c98a3a;
            --accent: #d97a56;
            --gold-grad: linear-gradient(135deg, #f7d488 0%, #e6b456 48%, #c98a3a 100%);
            --border: rgba(246, 237, 221, 0.08);
            --border-strong: rgba(246, 237, 221, 0.14);
            --border-gold: rgba(230, 180, 86, 0.32);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.38);
            --shadow-lg: 0 28px 70px -14px rgba(0, 0, 0, 0.62);
            --glow-gold: 0 0 26px rgba(230, 180, 86, 0.30);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-1);
            background-image:
                radial-gradient(1200px 600px at 12% -8%, rgba(247, 212, 136, 0.14), transparent 55%),
                radial-gradient(1000px 520px at 92% 4%, rgba(201, 138, 58, 0.13), transparent 52%),
                radial-gradient(900px 700px at 50% 116%, rgba(217, 122, 86, 0.10), transparent 55%),
                linear-gradient(to right, rgba(246, 237, 221, 0.022) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(246, 237, 221, 0.022) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 46px 46px, 46px 46px;
        }

        .container {
            width: 100%;
            max-width: 840px;
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(1.1);
            -webkit-backdrop-filter: blur(18px) saturate(1.1);
            padding: 32px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(246, 237, 221, 0.06);
            color: var(--text);
        }

        .page-head { text-align: center; margin-bottom: 26px; }
        .page-head .logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            border-radius: 15px;
            background: linear-gradient(150deg, rgba(247, 212, 136, 0.22), rgba(201, 138, 58, 0.12));
            border: 1px solid var(--border-gold);
            box-shadow: var(--glow-gold), inset 0 1px 0 rgba(246, 237, 221, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-head h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fdf3dd, #e6b456);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .page-head .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

        /* ===== 上传区 ===== */
        .upload-area {
            border: 2px dashed rgba(230, 180, 86, 0.38);
            background: rgba(24, 18, 13, 0.45);
            border-radius: var(--radius-md);
            padding: 36px;
            text-align: center;
            cursor: pointer;
            transition: all .25s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .upload-area::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(300px 120px at 50% 0%, rgba(230, 180, 86, 0.10), transparent 70%);
            opacity: 0;
            transition: opacity .25s;
        }
        .upload-area:hover { border-color: var(--gold-2); box-shadow: var(--glow-gold), inset 0 0 30px rgba(230, 180, 86, 0.06); transform: translateY(-1px); }
        .upload-area:hover::before { opacity: 1; }
        .upload-icon { font-size: 42px; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(230, 180, 86, 0.5)); }
        .upload-text { color: var(--text-2); font-size: 15px; }
        .upload-hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
        .file-input { display: none; }

        /* ===== 待导入队列 ===== */
        .pending-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        .pending-list:empty { display: none; }

        .pending-item {
            background: rgba(24, 18, 13, 0.55);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .pending-item:hover { border-color: var(--border-gold); box-shadow: var(--shadow-md); }

        .p-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(18, 12, 8, 0.25);
        }
        .p-name { font-weight: 600; color: var(--text); font-size: 14.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-size { font-size: 12px; color: var(--muted); flex-shrink: 0; }
        .p-remove {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 15px;
            padding: 5px 8px;
            flex-shrink: 0;
            border-radius: 8px;
            transition: all .2s;
        }
        .p-remove:hover { color: #ef9a72; background: rgba(217, 122, 86, 0.12); }

        .p-body { padding: 14px 18px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

        .p-cover { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; flex-shrink: 0; }
        .p-cover-label { font-size: 12px; color: var(--muted); }

        .p-cover-box {
            width: 88px;
            height: 88px;
            border: 2px dashed rgba(230, 180, 86, 0.38);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            overflow: hidden;
            background: rgba(18, 12, 8, 0.5);
            transition: all .2s ease;
        }
        .p-cover-box:hover { border-color: var(--gold-2); box-shadow: var(--glow-gold); }
        .p-cover-box img { width: 100%; height: 100%; object-fit: cover; }

        .p-cover-clear {
            background: rgba(217, 122, 86, 0.10);
            border: 1px solid rgba(217, 122, 86, 0.4);
            color: var(--accent);
            border-radius: 8px;
            padding: 5px 11px;
            cursor: pointer;
            font-size: 12px;
            transition: all .2s;
        }
        .p-cover-clear:hover { background: rgba(217, 122, 86, 0.2); }

        .p-meta { flex: 1; min-width: 260px; }
        .p-meta summary { cursor: pointer; user-select: none; color: var(--text-2); font-size: 13px; outline: none; }
        .p-meta summary:hover { color: var(--gold-2); }

        .p-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .p-meta-grid input, .p-meta-grid select {
            background: rgba(18, 12, 8, 0.62);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .p-meta-grid input::placeholder { color: #7c6c59; }
        .p-meta-grid input:focus, .p-meta-grid select:focus { border-color: rgba(230, 180, 86, 0.6); box-shadow: 0 0 0 3px rgba(230, 180, 86, 0.12); }

        /* ===== 提交栏 ===== */
        .submit-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }

        .submit-btn {
            border: none;
            background: var(--gold-grad);
            color: #3a2812;
            padding: 13px 34px;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(230, 180, 86, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all .22s ease;
            font-family: inherit;
        }
        .submit-btn:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 0 30px rgba(230, 180, 86, 0.46); transform: translateY(-1px); }
        .submit-btn:disabled { opacity: .45; cursor: not-allowed; }

        .submit-hint { font-size: 13px; color: var(--muted); }

        /* ===== 上传进度列表 ===== */
        .file-list { display: flex; flex-direction: column; gap: 16px; }

        .file-item {
            background: rgba(24, 18, 13, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: var(--shadow-sm);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
        }
        .file-item:hover { border-color: var(--border-gold); box-shadow: var(--shadow-md); }

        .file-info { display: flex; flex-direction: column; flex: 1; margin-right: 20px; }
        .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .file-name { font-weight: 600; color: var(--text); font-size: 15px; }
        .file-size { font-size: 12px; color: var(--muted); }

        .status-badge {
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            min-width: 82px;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 14px -4px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }
        .status-uploading { background: linear-gradient(135deg, #f0a83a, #d97706); box-shadow: 0 6px 16px -4px rgba(217, 119, 6, 0.6); }
        .status-processing { background: linear-gradient(135deg, #60a5fa, #2563eb); box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.6); }
        .status-completed { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 6px 16px -4px rgba(5, 150, 105, 0.6); }
        .status-error { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 6px 16px -4px rgba(220, 38, 38, 0.6); }

        .progress-wrapper { margin-top: 10px; display: none; }
        .progress-bar-container { width: 100%; height: 7px; background-color: rgba(18, 12, 8, 0.85); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
        .progress-bar { height: 100%; width: 0%; border-radius: 4px; transition: width 0.4s ease, background-color 0.4s; }
        .progress-text { font-size: 12px; color: var(--muted); margin-top: 7px; text-align: right; }

        .log-details {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-2);
            background: rgba(18, 12, 8, 0.5);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid rgba(230, 180, 86, 0.12);
        }
        .log-details summary { cursor: pointer; user-select: none; color: var(--text); outline: none; font-weight: 600; font-size: 13px; }
        .log-details summary:hover { color: var(--gold-2); }

        .log-list { margin: 8px 0 0 0; padding: 0 0 0 20px; list-style: none; max-height: 200px; overflow-y: auto; }
        .log-list li { margin: 0; padding: 8px 12px; line-height: 1.5; display: flex; align-items: center; border-radius: 8px; }
        .log-done { color: #a9e8c4; }
        .log-running { color: #bcd6f7; animation: pulseText 2s infinite; }
        .log-duration {
            margin-left: auto;
            font-size: 12px;
            color: #f5d488;
            background: rgba(230, 180, 86, 0.10);
            border: 1px solid rgba(230, 180, 86, 0.24);
            padding: 2px 10px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 600;
        }

        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="page-head">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 5.4A2.4 2.4 0 0 1 6.4 3H11v15.6H6.4A2.4 2.4 0 0 0 4 21V5.4z" fill="#f7d488"/>
                <path d="M20 5.4A2.4 2.4 0 0 0 17.6 3H13v15.6h4.6A2.4 2.4 0 0 1 20 21V5.4z" fill="#e6b456"/>
                <path d="M12 3v15.6" stroke="#c98a3a" stroke-width="1.1"/>
                <path d="M7 6.8h2.3M7 9.4h2.3" stroke="#c98a3a" stroke-width="0.9" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>知识库文件导入</h1>
        <div class="sub">批量导入书籍资料，可为每个文件单独配置封面与元数据</div>
    </div>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">☁️</div>
        <div class="upload-text">点击或拖拽文件到此处</div>
        <div class="upload-hint">支持批量导入（PDF / MD）</div>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
    </div>

    <div class="pending-list" id="pendingList"></div>

    <div class="submit-bar">
        <button class="submit-btn" id="btnSubmit" disabled>提交导入</button>
        <span class="submit-hint" id="submitHint">请先选择文件</span>
    </div>

    <div id="fileList" class="file-list"></div>
</div>

<script>
    const API_BASE = 'http://127.0.0.1:8000';
    const CONTENT_TYPES = ['有声书信息', '书籍简介', '作者介绍', '听书笔记', '推荐运营资料', '用户评论摘要', '常见问答'];

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const pendingList = document.getElementById('pendingList');
    const fileList = document.getElementById('fileList');
    const btnSubmit = document.getElementById('btnSubmit');
    const submitHint = document.getElementById('submitHint');

    let pendingFiles = [];
    let seq = 0;

    function escapeHtml(str) {
        return String(str ?? '')
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function typeOptions(selected) {
        let html = '<option value="">自动识别</option>';
        for (const ct of CONTENT_TYPES) {
            html += `<option ${ct === selected ? 'selected' : ''}>${ct}</option>`;
        }
        return html;
    }

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#e6b456';
        dropZone.style.background = 'rgba(230, 180, 86, 0.08)';
    });
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
        addPendingFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => {
        addPendingFiles(e.target.files);
        fileInput.value = '';
    });

    function addPendingFiles(files) {
        for (const file of Array.from(files)) {
            pendingFiles.push({ id: 'p' + (++seq), file, coverFile: null, coverPreview: '' });
        }
        renderPendingList();
    }

    function renderPendingList() {
        pendingList.innerHTML = '';
        pendingFiles.forEach((item) => {
            const html = `
            <div class="pending-item" data-id="${item.id}">
                <div class="p-head">
                    <span class="p-name">${escapeHtml(item.file.name)}</span>
                    <span class="p-size">${(item.file.size / 1024).toFixed(2)} KB</span>
                    <button class="p-remove" data-id="${item.id}">✕</button>
                </div>
                <div class="p-body">
                    <div class="p-cover">
                        <span class="p-cover-label">封面（可选）</span>
                        <div class="p-cover-box" data-id="${item.id}">
                            ${item.coverPreview ? `<img src="${item.coverPreview}" alt="封面">` : '点击选封面'}
                        </div>
                        <input type="file" class="p-cover-input" data-id="${item.id}" accept="image/*" style="display:none">
                        ${item.coverFile ? `<button class="p-cover-clear" data-id="${item.id}">移除封面</button>` : ''}
                    </div>
                    <details class="p-meta">
                        <summary>📚 书籍元数据（可选，留空自动识别）</summary>
                        <div class="p-meta-grid">
                            <input class="p-meta-book" data-id="${item.id}" placeholder="书名（如：三体）">
                            <input class="p-meta-author" data-id="${item.id}" placeholder="作者（如：刘慈欣）">
                            <select class="p-meta-type" data-id="${item.id}">${typeOptions()}</select>
                            <input class="p-meta-category" data-id="${item.id}" placeholder="类别（如：科幻）">
                            <input class="p-meta-duration" data-id="${item.id}" placeholder="时长（如：50小时）">
                        </div>
                    </details>
                </div>
            </div>`;
            pendingList.insertAdjacentHTML('beforeend', html);
        });
        updateSubmitBtn();
    }

    function updateSubmitBtn() {
        const n = pendingFiles.length;
        btnSubmit.disabled = n === 0;
        btnSubmit.textContent = n > 0 ? `提交导入 (${n})` : '提交导入';
        submitHint.textContent = n > 0 ? `已选择 ${n} 个文件，可逐项配置封面与元数据后提交` : '请先选择文件';
    }

    function findItem(id) {
        return pendingFiles.find(p => p.id === id);
    }

    pendingList.addEventListener('click', (e) => {
        const coverBox = e.target.closest('.p-cover-box');
        const clearBtn = e.target.closest('.p-cover-clear');
        const removeBtn = e.target.closest('.p-remove');

        if (coverBox) {
            const input = coverBox.parentElement.querySelector('.p-cover-input');
            input.click();
            return;
        }
        if (clearBtn) {
            const item = findItem(clearBtn.dataset.id);
            if (item) { item.coverFile = null; item.coverPreview = ''; renderPendingList(); }
            return;
        }
        if (removeBtn) {
            pendingFiles = pendingFiles.filter(p => p.id !== removeBtn.dataset.id);
            renderPendingList();
            return;
        }
    });

    pendingList.addEventListener('change', (e) => {
        if (e.target.classList.contains('p-cover-input')) {
            const item = findItem(e.target.dataset.id);
            const f = e.target.files[0] || null;
            if (item && f) {
                item.coverFile = f;
                const reader = new FileReader();
                reader.onload = (ev) => { item.coverPreview = ev.target.result; renderPendingList(); };
                reader.readAsDataURL(f);
            }
        }
    });

    btnSubmit.addEventListener('click', submitAll);

    async function submitAll() {
        if (pendingFiles.length === 0) return;

        const items = pendingFiles.map(item => {
            const root = pendingList.querySelector(`.pending-item[data-id="${item.id}"]`);
            const meta = {
                book_name: root.querySelector('.p-meta-book').value.trim(),
                author: root.querySelector('.p-meta-author').value.trim(),
                content_type: root.querySelector('.p-meta-type').value.trim(),
                category: root.querySelector('.p-meta-category').value.trim(),
                duration: root.querySelector('.p-meta-duration').value.trim(),
            };
            return { ...item, meta };
        });

        pendingFiles = [];
        renderPendingList();
        btnSubmit.disabled = true;
        submitHint.textContent = '正在导入…';

        for (const item of items) {
            await uploadFile(item);
        }

        submitHint.textContent = '已提交完成，可继续选择文件';
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');
        const safe = Math.min(Math.max(percentage, 0), 100);
        bar.style.width = safe + '%';
        text.textContent = Math.round(safe) + '%';
        if (safe >= 100) bar.style.background = 'linear-gradient(90deg, #34d399, #10b981)';
        else if (safe < 10) bar.style.background = 'linear-gradient(90deg, #f0a83a, #fbbf24)';
        else bar.style.background = 'linear-gradient(90deg, #60a5fa, #2563eb)';
    }

    async function uploadFile(item) {
        const isPDF = item.file.name.toLowerCase().endsWith('.pdf');
        const totalNodes = isPDF ? 9 : 8;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        fileList.insertAdjacentHTML('afterbegin', `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${escapeHtml(item.file.name)}</span>
                        <span class="file-size">${(item.file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container"><div class="progress-bar"></div></div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', item.file);
        for (const [k, v] of Object.entries(item.meta || {})) {
            if (v) formData.append(k, v);
        }
        if (item.coverFile) {
            formData.append('cover', item.coverFile);
        }

        try {
            progressWrapper.style.display = 'block';
            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = '开始上传文件...';
            initialLog.className = 'log-running';
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Upload failed');
            const result = await response.json();
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            pollStatus(taskId, itemEl, totalNodes);
        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);
            const errLog = document.createElement('li');
            errLog.textContent = '❌ 网络请求失败或服务器异常';
            errLog.style.color = '#f87171';
            logListEl.appendChild(errLog);
        }
    }

    function formatDuration(seconds) {
        if (seconds < 60) return seconds.toFixed(1) + 's';
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        let pct = (done.length / totalNodes) * 100;
        if (running.length > 0) pct += (0.5 / totalNodes) * 100;
        if (pct >= 100) pct = 95;

        let totalDuration = 0;
        for (const k in durationMap) totalDuration += durationMap[k];
        const durText = totalDuration > 0 ? ` | 总耗时: ${formatDuration(totalDuration)}` : '';

        logSummary.textContent = `📋 运行日志 (已完成: ${done.length}, 进行中: ${running.length}, 共 ${totalNodes} 步${durText})`;
        logListEl.innerHTML = '';

        for (const it of done) {
            if (it === 'upload_file') continue;
            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${it} 节点执行完成`;
            li.appendChild(nameSpan);
            if (durationMap[it] !== undefined) {
                const ds = document.createElement('span');
                ds.className = 'log-duration';
                ds.textContent = formatDuration(durationMap[it]);
                li.appendChild(ds);
            }
            li.className = 'log-done';
            logListEl.appendChild(li);
        }
        for (const it of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${it} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }
        logListEl.scrollTop = logListEl.scrollHeight;
        return pct;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');
                const data = await res.json();
                if (stopped) return;

                const pct = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);
                    setTimeout(() => { logDetails.open = false; }, 1000);
                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = '❌ 工作流执行失败中止';
                    errLog.style.color = '#f87171';
                    logListEl.appendChild(errLog);
                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, pct);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>

</body>
</html>
